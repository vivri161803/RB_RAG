# ============================================================================
# rules.yaml — Regole di validazione per il Dynamic Gatekeeper
# Basato su: Tassonomia Dometria Connect (Immobili, Aziende, Attività Commerciali)
# ============================================================================
# IMP (Imprescindibile) → [MANDATORY] — blocca il flusso se assente
# AGG (Aggiuntivo)      → [OPTIONAL]  — arricchisce ma non blocca
#
# STRUTTURA:
#   - macro_categories: attributi comuni a tutte le tipologie (Sezione 3 doc)
#   - sub_categories.intake: campi specifici per sotto-tipologia (Sezione 4 doc)
#   - sub_categories.query: criteri di ricerca per sotto-tipologia
#
# PER AGGIUNGERE UNA TIPOLOGIA:
#   1. Aggiungi un blocco in sub_categories.intake.<MacroId>
#   2. Aggiungi il corrispondente blocco in sub_categories.query.<MacroId>
#   3. Il campo "description" serve per il matching semantico (embedding)
# ============================================================================

score_threshold: 0.30

fallbacks:
  intake: "Estrai quanti più dettagli pertinenti sull'asset (immobile, azienda o attività) citati dall'utente."
  query: "Estrai preferenze generali sull'asset e budget se presenti."

# --------------------------------------------------------------------------
# MACRO-CATEGORIA: Immobili
# Attributi comuni a TUTTE le tipologie (Sezione 3 del documento)
# --------------------------------------------------------------------------
macro_categories:
  - id: Immobili
    description: >
      immobile, proprietà, acquisto, vendita, affitto, investimento immobiliare,
      real estate, castello, palazzo, villa, casale, appartamento, attico,
      capannone, ufficio, negozio, hotel, albergo, agriturismo, terreno,
      magazzino, logistica, retail, centro commerciale, residence
    rule: >
      [MANDATORY] Regione, Provincia, Comune, Prezzo richiesto (€),
      Stato di occupazione (Libero/Occupato/Locato),
      Stato di conservazione (Da ristrutturare/Buono/Ottimo/Nuovo).
      [OPTIONAL] Zona/Quartiere, Indirizzo, Coordinate GPS,
      Prezzo trattabile (Sì/No), Anno di costruzione, Classe energetica (APE),
      Vincoli urbanistici/paesaggistici/monumentali,
      Destinazione d'uso attuale, Destinazione d'uso potenziale.
    mandatory_fields:
      - Regione
      - Provincia
      - Comune
      - Prezzo richiesto (€)
      - Stato di occupazione
      - Stato di conservazione
    optional_fields:
      - Zona/Quartiere
      - Anno di costruzione
      - Classe energetica (APE)
      - Vincoli
      - Destinazione d'uso attuale
      - Destinazione d'uso potenziale

  # --------------------------------------------------------------------------
  # MACRO-CATEGORIA: Aziende & Operazioni Straordinarie
  # Attributi comuni (Sezione 2 del documento Aziende)
  # --------------------------------------------------------------------------
  - id: Aziende
    description: >
      azienda, impresa, società, cessione azienda, acquisizione azienda,
      share deal, operazione straordinaria, M&A, fusione, scissione,
      ramo d'azienda, passaggio generazionale, startup, PMI,
      manifattura, logistica, trasporti, costruzioni, energia, agroindustria,
      food, retail, distribuzione, hospitality, sanità, ICT, tecnologia,
      servizi imprese, ambiente, economia circolare, ESG
    rule: >
      [MANDATORY] Regione sede legale, Provincia sede legale,
      Macro-settore, Settore operativo,
      Dimensione azienda (Micro/PMI/Mid-cap/Corporate/Gruppo),
      Fatturato ultimo esercizio (€), EBITDA (€),
      Prezzo richiesto / Valutazione (€),
      Tipologia operazione (Share deal/Cessione ramo/Asset deal/ecc.),
      Numero dipendenti,
      Modello di business (B2B/B2C/B2B2C/Ricorrente/ecc.),
      Mercato geografico (Locale/Regionale/Nazionale/Internazionale).
      [OPTIONAL] Comune sede legale, Sedi operative (regioni),
      ATECO primario, Anno di costituzione, Forma giuridica,
      EBITDA margin (%), Utile netto (€), Trend fatturato triennio,
      PFN (€), Patrimonio netto (€), Quota offerta (%),
      Motivazione cessione, Management chiave (n.),
      Disponibilità permanenza management,
      % export, Concentrazione clienti top 3 (%),
      Contratti ricorrenti (% fatturato), Numero clienti attivi,
      Immobili di proprietà, Brevetti/marchi, Certificazioni.
    mandatory_fields:
      - Regione sede legale
      - Provincia sede legale
      - Macro-settore
      - Settore operativo
      - Dimensione azienda
      - Fatturato ultimo esercizio (€)
      - EBITDA (€)
      - Prezzo richiesto / Valutazione (€)
      - Tipologia operazione
      - Numero dipendenti
      - Modello di business
      - Mercato geografico
    optional_fields:
      - Comune sede legale
      - Anno di costituzione
      - Forma giuridica
      - EBITDA margin (%)
      - Trend fatturato triennio
      - Quota offerta (%)
      - Motivazione cessione
      - Concentrazione clienti top 3 (%)
      - Brevetti/marchi
      - Certificazioni

  # --------------------------------------------------------------------------
  # MACRO-CATEGORIA: Attività Commerciali
  # Attributi comuni (Sezione 2 del documento Attività Commerciali)
  # --------------------------------------------------------------------------
  - id: Attività Commerciali
    description: >
      attività commerciale, negozio, bar, ristorante, pizzeria, gelateria,
      panificio, pasticceria, parrucchiere, estetica, farmacia, tabaccheria,
      edicola, lavanderia, palestra, fitness, autofficina, carrozzeria,
      concessionaria, agenzia immobiliare, agenzia assicurativa, B&B,
      affittacamere, ostello, bowling, escape room, sala giochi,
      cessione attività, avviamento commerciale, licenza commerciale
    rule: >
      [MANDATORY] Regione, Provincia, Comune,
      Zona (centro storico/commerciale/residenziale/periferia),
      Tipologia attività, Prezzo richiesto (€), Fatturato annuo (€).
      [OPTIONAL] Indirizzo/via, Flusso pedonale zona (Alto/Medio/Basso),
      Vicinanza trasporti (Sì/No), Parcheggio zona (Sì/No),
      Canone locazione annuo (€), Durata residua contratto locazione (anni),
      Proprietà mura (Sì/No), Superficie totale (mq),
      Trend fatturato (crescita/stabile/calo), Modello di ricavo,
      Forma giuridica, Numero dipendenti, Anni di attività,
      Avviamento storico (Alto/Medio/Basso),
      Potenziale di sviluppo (Alto/Medio/Basso).
    mandatory_fields:
      - Regione
      - Provincia
      - Comune
      - Zona
      - Tipologia attività
      - Prezzo richiesto (€)
      - Fatturato annuo (€)
    optional_fields:
      - Flusso pedonale zona
      - Canone locazione annuo (€)
      - Durata residua contratto locazione (anni)
      - Proprietà mura (Sì/No)
      - Numero dipendenti
      - Anni di attività
      - Avviamento storico
      - Potenziale di sviluppo

# --------------------------------------------------------------------------
# SOTTO-CATEGORIE — INTAKE
# I campi qui si SOMMANO a quelli della macro-categoria Immobili.
# --------------------------------------------------------------------------
sub_categories:
  intake:
    Immobili:

      # ── RESIDENZIALE STORICO / PREGIO ──────────────────────────────────

      - id: Castello
        description: "castello, maniero, torre, fortezza, residenza storica feudale"
        rule: >
          [MANDATORY] Superficie coperta totale (mq), Superficie terreno/parco (ha),
          Vincolo monumentale D.Lgs. 42/2004 (Sì/No).
          [OPTIONAL] Numero piani fuori terra, Numero piani interrati,
          Numero camere/vani, Numero bagni, Numero unità autonome,
          Epoca storica, Torre/torrione (Sì/No), Mura di cinta (Sì/No),
          Cappella/chiesa (Sì/No), Affreschi di pregio (Sì/No),
          Parco/giardino storico (ha), Dipendenze/annessi (mq),
          Piscina (Sì/No), Terreno agricolo annesso (ha),
          Distanza da centro abitato (km), Accesso stradale (asfaltato/sterrato),
          Distanza da aeroporto (km), Idoneità hospitality/ricettiva (Sì/No),
          Idoneità eventi/cerimonie (Sì/No), Restauri recenti (Sì/No).
        mandatory_fields:
          - Superficie coperta totale (mq)
          - Superficie terreno/parco (ha)
          - Vincolo monumentale (Sì/No)
        optional_fields:
          - Numero camere/vani
          - Numero bagni
          - Epoca storica
          - Torre/torrione (Sì/No)
          - Mura di cinta (Sì/No)
          - Piscina (Sì/No)
          - Terreno agricolo annesso (ha)
          - Idoneità hospitality (Sì/No)
          - Idoneità eventi (Sì/No)

      - id: Palazzo
        description: "palazzo storico, palazzo d'epoca, palazzetto, palazzo nobiliare, palazzo monumentale"
        rule: >
          [MANDATORY] Superficie coperta totale (mq), Numero piani,
          Vincolo monumentale D.Lgs. 42/2004 (Sì/No).
          [OPTIONAL] Numero unità immobiliari, Superficie terreno/corte (mq),
          Numero vani complessivi, Epoca storica, Piano nobile (Sì/No),
          Affreschi/soffitti decorati (Sì/No), Cortile interno (Sì/No),
          Scalone monumentale (Sì/No), Garage/posto auto (n.),
          Cantine/depositi (mq), Giardino/terrazza (mq),
          Reddito locativo annuo (€), Occupancy rate, Contratti in essere (n.).
        mandatory_fields:
          - Superficie coperta totale (mq)
          - Numero piani
          - Vincolo monumentale (Sì/No)
        optional_fields:
          - Numero unità immobiliari
          - Numero vani complessivi
          - Epoca storica
          - Piano nobile (Sì/No)
          - Cortile interno (Sì/No)
          - Reddito locativo annuo (€)

      # ── RESIDENZIALE PREMIUM / PRIVATO ─────────────────────────────────

      - id: Villa
        description: "villa, villa singola, villa bifamiliare, villa di lusso, villa con parco, residenza con giardino"
        rule: >
          [MANDATORY] Superficie coperta (mq), Superficie terreno (mq),
          Numero camere da letto.
          [OPTIONAL] Numero bagni, Numero piani, Livello finiture
          (Standard/Buono/Lusso), Domotica/smart home (Sì/No),
          Impianto riscaldamento (tipo), Climatizzazione (Sì/No),
          Piscina (Sì/No), Giardino (mq), Dependance (mq),
          Garage/posto auto (n.), Taverna/cantina (Sì/No),
          Vista (mare/lago/montagna/collina/altro),
          Esposizione prevalente, Privacy/isolamento (Alto/Medio/Basso).
        mandatory_fields:
          - Superficie coperta (mq)
          - Superficie terreno (mq)
          - Numero camere da letto
        optional_fields:
          - Numero bagni
          - Numero piani
          - Livello finiture
          - Piscina (Sì/No)
          - Giardino (mq)
          - Vista
          - Dependance (mq)

      - id: Casale
        description: "casale, rustico, cascina, casale rurale, casolare, casale ristrutturato, casale di campagna"
        rule: >
          [MANDATORY] Superficie coperta (mq), Superficie terreno (ha),
          Stato ristrutturazione (Ristrutturato/Parziale/Da ristrutturare).
          [OPTIONAL] Numero camere, Numero bagni,
          Annessi agricoli (mq), Oliveto (n. piante o ha),
          Vigneto (ha), Seminativi (ha), Bosco (ha),
          Livello finiture (Standard/Buono/Lusso), Piscina (Sì/No),
          Distanza da centro abitato (km), Accesso stradale (asfaltato/sterrato),
          Vista panoramica (Sì/No), Idoneità agrituristica (Sì/No),
          Idoneità ricettiva (Sì/No).
        mandatory_fields:
          - Superficie coperta (mq)
          - Superficie terreno (ha)
          - Stato ristrutturazione
        optional_fields:
          - Numero camere
          - Numero bagni
          - Oliveto (ha)
          - Vigneto (ha)
          - Piscina (Sì/No)
          - Idoneità agrituristica (Sì/No)

      - id: Appartamento
        description: "appartamento, bilocale, trilocale, quadrilocale, monolocale, unità abitativa, flat, alloggio"
        rule: >
          [MANDATORY] Superficie commerciale (mq), Numero vani,
          Numero camere da letto, Piano.
          [OPTIONAL] Numero bagni, Balcone/terrazzo (mq),
          Esposizione (doppia/singola), Vista (interna/esterna/panoramica),
          Luminosità (Alta/Media/Bassa), Livello finiture,
          Riscaldamento (Autonomo/Centralizzato), Climatizzazione (Sì/No),
          Cantina (mq), Posto auto/garage, Soffitta/sottotetto (Sì/No),
          Ascensore (Sì/No), Portineria/reception (Sì/No),
          Spese condominiali annue (€), Anno costruzione edificio.
        mandatory_fields:
          - Superficie commerciale (mq)
          - Numero vani
          - Numero camere da letto
          - Piano
        optional_fields:
          - Numero bagni
          - Balcone/terrazzo (mq)
          - Livello finiture
          - Ascensore (Sì/No)
          - Posto auto/garage
          - Spese condominiali annue (€)

      - id: Attico
        description: "attico, superattico, attico con terrazzo, penthouse, lastrico solare, attico panoramico"
        rule: >
          [MANDATORY] Superficie commerciale (mq), Numero vani,
          Numero camere da letto, Superficie terrazzo/lastrico solare (mq).
          [OPTIONAL] Numero bagni, Vista panoramica (tipologia),
          Doppia/tripla esposizione (Sì/No), Livello finiture (Standard/Buono/Lusso),
          Domotica (Sì/No), Climatizzazione (Sì/No),
          Posto auto/garage (n.), Cantina (Sì/No),
          Ascensore (Sì/No), Portineria (Sì/No),
          Piscina condominiale (Sì/No).
        mandatory_fields:
          - Superficie commerciale (mq)
          - Numero vani
          - Numero camere da letto
          - Superficie terrazzo/lastrico solare (mq)
        optional_fields:
          - Numero bagni
          - Vista panoramica
          - Livello finiture
          - Domotica (Sì/No)
          - Posto auto/garage (n.)

      # ── INDUSTRIALE / PRODUTTIVO ────────────────────────────────────────

      - id: Capannone industriale
        description: "capannone industriale, stabilimento produttivo, polo industriale, sito produttivo, impianto industriale"
        rule: >
          [MANDATORY] Superficie coperta (mq), Altezza sottotrave (m),
          Accesso TIR/bilici (Sì/No).
          [OPTIONAL] Area scoperta/piazzale (mq), Superficie uffici annessi (mq),
          Numero campate, Struttura portante (Prefabbricato/Acciaio/c.a./Misto),
          Potenza elettrica installata (kW), Cabina MT/BT (Sì/No),
          Carroponte (Sì/No + portata t), Impianto antincendio (tipo),
          CPI (Sì/No), Baie di carico (n.), Area di manovra mezzi (mq),
          Distanza casello autostradale (km), Tipo pavimentazione,
          Portata pavimento (kg/mq), Parcheggi (n.),
          Impianto fotovoltaico (kWp), Certificazioni ambientali.
        mandatory_fields:
          - Superficie coperta (mq)
          - Altezza sottotrave (m)
          - Accesso TIR/bilici (Sì/No)
        optional_fields:
          - Area scoperta/piazzale (mq)
          - Potenza elettrica (kW)
          - Carroponte (Sì/No)
          - Baie di carico (n.)
          - Distanza casello autostradale (km)
          - Impianto fotovoltaico (kWp)

      - id: Capannone logistico
        description: "capannone logistico, hub logistico, magazzino logistico, centro distribuzione, distribution center, polo logistico"
        rule: >
          [MANDATORY] Superficie coperta (mq), Altezza sottotrave (m),
          Baie di carico (n.), Accesso TIR/bilici (Sì/No).
          [OPTIONAL] Area scoperta/piazzale (mq), Uffici annessi (mq),
          Cross-docking (Sì/No), Scaffalature (tipo),
          Magazzino verticale automatizzato (Sì/No),
          Temperatura controllata (Sì/No), Cella frigorifera (Sì/No),
          Impianto antincendio/sprinkler (Sì/No), Videosorveglianza (Sì/No),
          Potenza elettrica (kW), Impianto fotovoltaico (kWp),
          Area manovra TIR (mq), Parcheggi TIR (n.),
          Distanza casello autostradale (km),
          Distanza interporto/hub logistico (km),
          Certificazioni (BREEAM/LEED/altro).
        mandatory_fields:
          - Superficie coperta (mq)
          - Altezza sottotrave (m)
          - Baie di carico (n.)
          - Accesso TIR/bilici (Sì/No)
        optional_fields:
          - Cross-docking (Sì/No)
          - Temperatura controllata (Sì/No)
          - Cella frigorifera (Sì/No)
          - Parcheggi TIR (n.)
          - Distanza casello autostradale (km)
          - Certificazioni

      - id: Capannone artigianale
        description: "capannone artigianale, laboratorio artigianale, officina, bottega artigiana, spazio produttivo artigianale"
        rule: >
          [MANDATORY] Superficie coperta (mq), Altezza interna (m).
          [OPTIONAL] Area esterna (mq), Ufficio annesso (mq),
          Potenza elettrica (kW), Scarichi industriali (Sì/No),
          Impianto aspirazione (Sì/No), Riscaldamento (Sì/No),
          Accesso veicolare (tipo: furgone/camion/TIR),
          Portone industriale (dimensioni), Parcheggi (n.).
        mandatory_fields:
          - Superficie coperta (mq)
          - Altezza interna (m)
        optional_fields:
          - Area esterna (mq)
          - Ufficio annesso (mq)
          - Potenza elettrica (kW)
          - Accesso veicolare (tipo)

      - id: Laboratorio
        description: "laboratorio, laboratorio scientifico, laboratorio farmaceutico, clean room, laboratorio chimico, laboratorio R&D"
        rule: >
          [MANDATORY] Superficie (mq).
          [OPTIONAL] Altezza interna (m), Uffici (mq),
          Potenza elettrica (kW), Impianti specialistici (descrizione),
          Portata pavimento (kg/mq), Climatizzazione/temperatura controllata (Sì/No),
          Accesso mezzi (tipo), Parcheggi (n.).
        mandatory_fields:
          - Superficie (mq)
        optional_fields:
          - Altezza interna (m)
          - Impianti specialistici
          - Temperatura controllata (Sì/No)
          - Potenza elettrica (kW)

      - id: Magazzino
        description: "magazzino, deposito, stoccaggio, storage, magazzino commerciale"
        rule: >
          [MANDATORY] Superficie (mq), Altezza interna (m).
          [OPTIONAL] Area esterna (mq), Scaffalature (Sì/No),
          Temperatura controllata (Sì/No), Impianto antincendio (Sì/No),
          Impianto antintrusione/vigilanza (Sì/No),
          Accesso veicolare (tipo), Baie di carico (n.), Parcheggi (n.).
        mandatory_fields:
          - Superficie (mq)
          - Altezza interna (m)
        optional_fields:
          - Area esterna (mq)
          - Scaffalature (Sì/No)
          - Temperatura controllata (Sì/No)
          - Baie di carico (n.)

      # ── DIREZIONALE / UFFICI ────────────────────────────────────────────

      - id: Ufficio
        description: "ufficio, spazio ufficio, open space, coworking, studio professionale, ufficio singolo, suite direzionale"
        rule: >
          [MANDATORY] Superficie (mq), Piano/i.
          [OPTIONAL] Numero postazioni stimabili, Layout (open space/suddiviso/misto),
          Sala riunioni (n.), Reception/ingresso dedicato (Sì/No),
          Cablaggio strutturato/fibra (Sì/No), Climatizzazione (Sì/No),
          Controsoffitto (Sì/No), Pavimento sopraelevato (Sì/No),
          Ascensore (Sì/No), Parcheggi (n.), Portineria/vigilanza (Sì/No),
          Accessibilità disabili (Sì/No), Servizi (bar/mensa/palestra),
          Certificazioni (LEED/WELL/altro),
          Spese di gestione/service charge (€/mq).
        mandatory_fields:
          - Superficie (mq)
          - Piano/i
        optional_fields:
          - Layout (open space/suddiviso/misto)
          - Sala riunioni (n.)
          - Climatizzazione (Sì/No)
          - Ascensore (Sì/No)
          - Parcheggi (n.)
          - Certificazioni

      - id: Palazzina direzionale
        description: "palazzina uffici, edificio direzionale, business center, palazzo uffici, torre uffici, centro direzionale"
        rule: >
          [MANDATORY] Superficie totale (mq), Numero piani.
          [OPTIONAL] Numero unità/piani indipendenti, Superficie singolo piano (mq),
          Reception/hall (Sì/No), Sala conferenze/auditorium (Sì/No),
          Ascensori (n.), Climatizzazione centralizzata (Sì/No),
          Gruppo elettrogeno (Sì/No), Parcheggi (n.),
          Area esterna/giardino (Sì/No), Certificazioni (LEED/BREEAM),
          Reddito locativo annuo (€), Occupancy rate, WAULT (anni).
        mandatory_fields:
          - Superficie totale (mq)
          - Numero piani
        optional_fields:
          - Numero unità/piani indipendenti
          - Sala conferenze (Sì/No)
          - Parcheggi (n.)
          - Reddito locativo annuo (€)
          - Occupancy rate
          - Certificazioni

      # ── COMMERCIALE / RETAIL ────────────────────────────────────────────

      - id: Negozio
        description: "negozio, locale commerciale, esercizio commerciale, bottega, showroom, retail, punto vendita"
        rule: >
          [MANDATORY] Superficie vendita (mq), Zona commerciale (centro/semicentro/periferia).
          [OPTIONAL] Superficie magazzino/retro (mq), Altezza interna (m),
          Fronte vetrina (ml), Numero vetrine, Flusso pedonale (Alto/Medio/Basso),
          Vicinanza trasporti pubblici (Sì/No), Canna fumaria (Sì/No),
          Passo carraio (Sì/No), Climatizzazione (Sì/No),
          Servizi igienici (n.), Destinazione merceologica attuale.
        mandatory_fields:
          - Superficie vendita (mq)
          - Zona commerciale
        optional_fields:
          - Fronte vetrina (ml)
          - Flusso pedonale
          - Canna fumaria (Sì/No)
          - Destinazione merceologica attuale

      - id: Capannone commerciale
        description: "capannone commerciale, showroom industriale, spazio espositivo commerciale, grande superficie commerciale"
        rule: >
          [MANDATORY] Superficie coperta (mq).
          [OPTIONAL] Altezza interna (m), Area esterna/parcheggi (mq),
          Visibilità da strada principale (Sì/No), Insegna/totem (Sì/No),
          Parcheggi clienti (n.), Vetrine/showroom (mq),
          Baie di carico (n.), Climatizzazione (Sì/No).
        mandatory_fields:
          - Superficie coperta (mq)
        optional_fields:
          - Altezza interna (m)
          - Parcheggi clienti (n.)
          - Visibilità da strada (Sì/No)

      - id: Retail Park
        description: "retail park, parco commerciale, villaggio commerciale, shopping park, outlet commerciale open air"
        rule: >
          [MANDATORY] GLA – Gross Leasable Area (mq), Numero unità commerciali.
          [OPTIONAL] Superficie lotto (mq), Ancora alimentare (Sì/No),
          Tenant mix (tipologie), Bacino d'utenza stimato (abitanti),
          Reddito locativo annuo (€), Occupancy rate, WAULT (anni),
          Anno apertura/ultima ristrutturazione, Parcheggi (n.),
          Visibilità da arteria principale (Sì/No).
        mandatory_fields:
          - GLA – Gross Leasable Area (mq)
          - Numero unità commerciali
        optional_fields:
          - Ancora alimentare (Sì/No)
          - Tenant mix
